template_version: 0.6
id: custom-1793128644303-nmlbbx
title: Amazon EKS Kubernetes Pod scan detection
description: The following analytic detects unauthenticated requests made against the Kubernetes Pods API, indicating potential unauthorized access attempts. It leverages the `aws_cloudwatchlogs_eks` data source, filtering for events where `user.username` is "system:anonymous", `verb` is "list", and `objectRef.resource` is "pods", with `requestURI` set to "/api/v1/pods". This activity is significant as it may signal attempts to access sensitive resources or execute unauthorized commands within the Kubernetes environment. If confirmed malicious, such access could lead to data compromise, unauthorized command execution, or lateral movement within the cluster.
status: test
logsource:
  scope: unknown
level: medium
detection:
  kql_query: |-
    dataset="aws_cloudwatchlogs_eks" user.username="system:anonymous" verb="list" objectRef.resource="pods" requestURI="/api/v1/pods"
    | extend cluster_name=source, src_ip=sourceIPs
    | summarize count=count() ,
              firstTime=min(['time']),
              lastTime=max(['time']),
              values_responseStatus_reason=values(responseStatus.reason),
              values_responseStatus_code=values(responseStatus.code),
              values_userAgent=values(userAgent),
              values_verb=values(verb),
              values_requestURI=values(requestURI)
      by src_ip, cluster_name, user_username=user.username, user_groups=user.groups
author: Rod Soto, Splunk
tags:
  - ai-translated
provenance:
  format: spl
  feed_id: splunk-escu
